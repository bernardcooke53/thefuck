[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "thefuck"
module-root = ""

[project]
name = "thefuck"
version = "0.1.0"
license-file = "LICENSE.md"
readme = "README.md"
description = "Magnificent app which corrects your previous console command"
authors = [{ name = "Bernard Cooke", email = "bernard-cooke@hotmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "psutil",
    "colorama",
    "decorator ; python_version>'2.7'",
    "pyte ; python_version>'2.7'",
    "win_unicode_console ; sys_platform=='win32'",
]

[project.scripts]
thefuck = "thefuck.entrypoints.main:main"
fuck = "thefuck.entrypoints.not_configured:main"

[project.urls]
source = "https://github.com/bernardcooke53/thefuck"
